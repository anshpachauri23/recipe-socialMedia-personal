# Northflank deployment configuration
version: 1

services:
  - name: recipe-social-backend
    type: service
    build:
      type: dockerfile
      dockerfile: Dockerfile
    ports:
      - port: 8080
        protocol: http
    environment:
      - PORT=8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE}
      - JWT_SECRET=${JWT_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      path: /api/posts/search?q=health
      interval: 30
      timeout: 10
      retries: 3
    scaling:
      min: 1
      max: 3
      targetCPU: 70
