AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Recipe Social Media API

Globals:
  Function:
    Timeout: 30
    Runtime: go1.x
    Environment:
      Variables:
        DB_CLUSTER_ARN: !Ref DatabaseClusterArn
        DB_SECRET_ARN: !Ref DatabaseSecretArn
        DB_NAME: !Ref DatabaseName
        JWT_SECRET: !Ref JwtSecret

Resources:
  # Authentication Functions
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/auth/login/
      Handler: main
      Events:
        LoginApi:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post
            Cors:
              AllowMethods: "'POST,OPTIONS'"
              AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              AllowOrigin: "'*'"

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/auth/register/
      Handler: main
      Events:
        RegisterApi:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post
            Cors:
              AllowMethods: "'POST,OPTIONS'"
              AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              AllowOrigin: "'*'"

  # Posts Functions
  GetPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/posts/get-posts/
      Handler: main
      Events:
        GetPostsApi:
          Type: Api
          Properties:
            Path: /posts
            Method: get
            Cors:
              AllowMethods: "'GET,OPTIONS'"
              AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              AllowOrigin: "'*'"

  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/posts/create-post/
      Handler: main
      Events:
        CreatePostApi:
          Type: Api
          Properties:
            Path: /posts
            Method: post
            Cors:
              AllowMethods: "'POST,OPTIONS'"
              AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              AllowOrigin: "'*'"

  FeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/posts/feed/
      Handler: main
      Events:
        FeedApi:
          Type: Api
          Properties:
            Path: /posts/feed
            Method: get
            Cors:
              AllowMethods: "'GET,OPTIONS'"
              AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              AllowOrigin: "'*'"

Parameters:
  DatabaseClusterArn:
    Type: String
    Description: ARN of the RDS Data API cluster
    Default: arn:aws:rds:us-east-1:123456789012:cluster:recipe-db-cluster
  
  DatabaseSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret for database credentials
    Default: arn:aws:secretsmanager:us-east-1:123456789012:secret:recipe-db-secret
  
  DatabaseName:
    Type: String
    Description: Name of the database
    Default: recipe_social
  
  JwtSecret:
    Type: String
    Description: JWT secret key
    Default: your-jwt-secret-key
    NoEcho: true

Outputs:
  RecipeApi:
    Description: "API Gateway endpoint URL for Recipe Social Media API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: RecipeApiUrl
